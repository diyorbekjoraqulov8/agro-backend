profile.short=Sunʼiy yoʻldosh orqali dalangizni tekshiradi: ekin qanday oʻsyapti, qancha suv kerak va qachon sugʻorish kerak.
profile.description=🌱 Dropy dalangizni sunʼiy yoʻldosh suratlari orqali tekshiradi.\n\n📊 Dala xaritasi: qayeri yaxshi, qayeri sust oʻsyapti\n📈 Mavsum davomida oʻsish, oʻtgan yil bilan taqqoslash\n💧 Ekin qachon suvsiz qolgani, dalaga qancha suv kerak\n🔔 Sugʻorish vaqti kelganda eslatma\n📄 PDF va Excel hisobot\n🌾 Bir nechta dala, har biriga oʻz ekini\n\nQanday ishlaydi: bir necha savol → dalani xaritada chizasiz → 1–2 daqiqada hisobot.\n\n💬 Savol yoki muammo boʻlsa — botning oʻzida yozing, mutaxassislar javob beradi.\n\n«Start» ni bosing 👇

