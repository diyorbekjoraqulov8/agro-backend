# ── Bot profili (Telegram: nom ≤ 64, qisqa ≤ 120, tavsif ≤ 512 belgi)
profile.name=Agro — dala tahlili
profile.short=Sunʼiy yoʻldosh orqali dalangizni tekshiradi: ekin qanday oʻsyapti, qancha suv kerak va qachon sugʻorish kerak.
profile.description=🌱 Agro dalangizni sunʼiy yoʻldosh suratlari orqali tekshiradi.\n\n📊 Dala xaritasi: qayeri yaxshi, qayeri sust oʻsyapti\n📈 Mavsum davomida oʻsish, oʻtgan yil bilan taqqoslash\n💧 Ekin qachon suvsiz qolgani, dalaga qancha suv kerak\n🔔 Sugʻorish vaqti kelganda eslatma\n📄 PDF va Excel hisobot\n🌾 Bir nechta dala, har biriga oʻz ekini\n\nQanday ishlaydi: 3 savol → dalani xaritada chizasiz → 1–2 daqiqada hisobot.\n\n💬 Savol yoki muammo boʻlsa — botning oʻzida yozing, mutaxassislar javob beradi.\n\n«Start» ni bosing 👇

