help.text=❓ Qoʻllanma\n\n1️⃣ «🛰 Dalani tekshirish» — xaritada dalangiz burchaklarini belgilang va yuboring.\n2️⃣ 1–2 daqiqada hisobot keladi: dala xaritasi (qayeri yaxshi, qayeri sust oʻsyapti), oʻsish grafigi, suv tanqisligi.\n3️⃣ «💧 Sugʻorish» — qachon sugʻorish kerakligini koʻrsatadi va vaqti kelganda eslatadi.\n4️⃣ «📋 Dalalarim» — har dalaning hisoboti, qayta tahlil, ekinni almashtirish.\n\n🎨 Xaritadagi ranglar: 🟢 yaxshi · 🟡 oʻrtacha · 🔴 sust oʻsish — qizil joyni borib koʻring (suv, oʻgʻit, zararkunanda).\n\n💬 Tushunmagan narsangiz boʻlsa — «⚙️ Sozlamalar → 💬 Fikr va yordam» ga yozing, mutaxassislar javob beradi.

