help.text=❓ Help\n\n1️⃣ “🗺 New field” — mark the corners of your field on the map and send.\n2️⃣ In 1–2 minutes you get a report: field map (where it grows well or poorly), growth chart, water stress.\n3️⃣ “💧 Irrigation” — when to irrigate, with a reminder when it’s time.\n4️⃣ “📋 My fields” — reports for each field, re-analysis, crop change.\n\n🎨 Map colours: 🟢 good · 🟡 average · 🔴 poor growth — check the red spots (water, fertiliser, pests).\n\n💬 Anything unclear — write to “💬 Feedback & help”, our specialists will reply.

