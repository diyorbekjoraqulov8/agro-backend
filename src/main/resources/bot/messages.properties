# ── Bot profili (Telegram: nom ≤ 64, qisqa ≤ 120, tavsif ≤ 512 belgi)
profile.name=Dropy — Field Analysis
profile.short=Checks your field from satellite images: how the crop grows, how much water it needs and when to irrigate.
profile.description=🌱 Dropy checks your field using satellite imagery.\n\n📊 Field map: where the crop grows well and where poorly\n📈 Growth over the season, compared with last year\n💧 When plants lacked water, how much water the field needs\n🔔 A reminder when it is time to irrigate\n📄 PDF and Excel reports\n🌾 Several fields, each with its own crop\n\nHow it works: a few questions → draw your field on a map → report in 1–2 minutes.\n\n💬 Questions or problems? Write right here in the bot — our specialists reply.\n\nPress “Start” 👇

