help.text=❓ Справка\n\n1️⃣ «🛰 Проверить поле» — отметьте углы поля на карте и отправьте.\n2️⃣ Через 1–2 минуты придёт отчёт: карта поля (где растёт хорошо, где слабо), график роста, нехватка воды.\n3️⃣ «💧 Полив» — когда поливать, и напоминание, когда пора.\n4️⃣ «📋 Мои поля» — отчёт по каждому полю, повторный анализ, смена культуры.\n\n🎨 Цвета на карте: 🟢 хорошо · 🟡 средне · 🔴 слабый рост — проверьте красные места (вода, удобрение, вредители).\n\n💬 Что-то непонятно — напишите в «⚙️ Настройки → 💬 Отзывы и помощь», специалисты ответят.

