spring:
  application:
    name: agro

  # Lokal sirlar (DB_PASSWORD, ...) — .env.example dan nusxa oling. .env git'ga tushmaydi.
  # Haqiqiy env o'zgaruvchisi .env dagidan ustun turadi.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agro}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  profiles:
    default: dev

  # Fayl yuklash (chatga rasm/PDF). app.files.max-size bilan bir xil bo'lsin; oshsa — 413
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # @Scheduled thread'lari. Default 1 — sug'orish aylanishi (ko'p dala) tugaguncha tahlil worker'i kutib qolardi
  task:
    scheduling:
      pool:
        size: 4

  # Bot matnlari (en — asosiy, uz, ru)
  messages:
    basename: bot/messages
    fallback-to-system-locale: false   # server tili (masalan ru) noma'lum tilga tushib qolmasin

  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 200

server:
  port: 8081
  error:
    include-stacktrace: never
    include-message: never

jwt:
  public-key: classpath:keys/public.pem
  private-key: ${JWT_PRIVATE_KEY:classpath:keys/private.pem}
  issuer: agro
  access-token-ttl: 15m
  refresh-token-ttl: 3d

app:
  # Fayllar serverdagi papkada; DB'da — metadata va papkaga NISBIY yo'l. Prod'da — backup qilinadigan disk/volume
  files:
    dir: ${FILES_DIR:storage/files}
    max-size: 10MB
  cookie:
    secure: true
    same-site: Strict

  login:
    max-attempts: 5
    lock-duration: 15m

# Python sun'iy yo'ldosh xizmati (satellite-service/). Faqat ichki tarmoq
satellite:
  base-url: ${SATELLITE_URL:http://localhost:8090}
  internal-key: ${SATELLITE_INTERNAL_KEY}   # default YO'Q — Python'dagi INTERNAL_KEY bilan bir xil
  connect-timeout: 5s
  read-timeout: 150s                        # birlik MAJBURIY: 150 = 150 ms (CLAUDE.md 5.5)

# Tahlil navbati (analysis_jobs) — worker Python satellite-service'ni chaqiradi
analysis:
  worker:
    enabled: ${ANALYSIS_WORKER_ENABLED:true}
    poll-interval: 10s
    batch-size: 2
    max-attempts: 3
    retry-base: 2m          # 2, 4, 8 daqiqa
    stuck-after: 10m        # RUNNING'da shundan ortiq — ilova o'chgan, navbatga qaytariladi

# Sug'orish eslatmasi — har soat; dala MAHALLIY vaqti bo'yicha soat {hour} dan keyin, kuniga bir marta (global)
irrigation:
  reminders:
    enabled: ${IRRIGATION_REMINDERS_ENABLED:true}
    hour: 7
    cron: "0 5 * * * *"

# Telegram bot (long polling). Xavfsiz default — o'chiq; dev'da application-dev.yml yoqadi.
# Bitta token bilan FAQAT bitta jarayon poll qilsin (IntelliJ + terminal = 409 Conflict)
telegram:
  enabled: ${TELEGRAM_ENABLED:false}
  polling: ${TELEGRAM_POLLING:true}    # false — faqat yuboradi (2-instans, sinov)
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  miniapp-url: ${MINIAPP_URL:}
  support-chat-id: ${TELEGRAM_SUPPORT_CHAT_ID:}   # ixtiyoriy: yangi murojaatlar xodimlar guruhiga
  public-api-url: ${PUBLIC_API_URL:}              # ixtiyoriy: https://api.example.uz — onboarding oxiridagi inline "🗺" tugmasi

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

logging:
  pattern:
    correlation: "[%X{requestId:-}, %X{userId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# C2: Ob-havo xavfi ogohlantirishi (Open-Meteo). Chegaralar — admin Sozlamalarida (weather.*).
# Har soat tekshiriladi, katak prognozi 3 soatda bir yangilanadi (har soniya EMAS — modellar 1–6 soatda yangilanadi).
weather:
  enabled: ${WEATHER_ENABLED:true}             # false — faqat ogohlantirish job'i o'chadi; botdagi "🌦 Ob-havo" ishlayveradi
  forecast-url: ${OPEN_METEO_URL:https://api.open-meteo.com/v1/forecast}
  api-key: ${OPEN_METEO_API_KEY:}             # bo'sh — bepul API (notijorat); prod: customer-api + kalit
  connect-timeout: 5s
  read-timeout: 20s
  refresh-after: 3h
  cron: "0 20 * * * *"                         # har soat :20 da (sug'orish eslatmasi :05 da)
  quiet-from: 21                               # dala vaqti bo'yicha 21:00–07:00 — yuborilmaydi
  quiet-to: 7

# C3: Avtomatik monitoring — har yangi Sentinel-2 surati bilan dala tekshiriladi (Python /monitor).
# Yoqish, "faqat pullik", chegaralar — admin Sozlamalarida (monitoring.*). Bu yerda — yuk va oraliqlar.
monitoring:
  job-enabled: ${MONITORING_JOB_ENABLED:true}
  cron: "0 40 * * * *"                 # har soat :40 da (sug'orish :05, ob-havo :20)
  batch: 40                            # bir tick'da nechta dala (Python ~2 s / ~10 s har biri)
  after-new-scene: 3d
  after-no-scene: 1d
  after-unavailable: 2h
  hours-from: 8                        # server vaqti: kunduzi tekshiriladi va xabar ketadi
  hours-to: 20

# C4: AI maslahatchi — Claude (Anthropic API, vision). Model, limitlar — admin Sozlamalarida (advisor.*).
# ⚠️ Claude Pro (claude.ai) obunasi API EMAS: console.anthropic.com da API kalit + kredit kerak.
advisor:
  api-key: ${ANTHROPIC_API_KEY:}                # bo'sh — AI maslahat o'chiq
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  timeout: 120s                                 # rasm + adaptive thinking ~10–40 s
  max-attempts: 3                               # 429/5xx — keyin agronomga
  job-enabled: ${ADVISOR_JOB_ENABLED:true}
