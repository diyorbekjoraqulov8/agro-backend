# Dev: Python satellite-service va Postgres'ni Docker'da ishga tushirish.
#   docker compose up -d --build     — yig'ish va ishga tushirish
#   docker compose logs -f satellite — log
#   docker compose down              — to'xtatish
# satellite: kalit root .env dagi SATELLITE_INTERNAL_KEY dan olinadi — Java bilan avtomatik bir xil.
# db: birinchi marta ko'tarilganda "agro" bazasini o'zi yaratadi (.env.example: DB_USERNAME=postgres,
#     DB_PASSWORD bo'sh — shuning uchun trust auth).
# Java (./gradlew bootRun) hozircha kompyuterda; prod compose — deploy/compose.prod.yaml, bunga tegishli emas.
services:
  satellite:
    build: ./satellite-service
    image: agro-satellite:dev
    environment:
      INTERNAL_KEY: ${SATELLITE_INTERNAL_KEY:?root .env da SATELLITE_INTERNAL_KEY yo'q}
    ports:
      - "127.0.0.1:8090:8090"   # faqat shu kompyuterdan; tarmoqqa ochilmaydi
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agro
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"   # faqat localhost (trust auth!); 5433 — native Postgres (5432) bilan to'qnashmasin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agro"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
